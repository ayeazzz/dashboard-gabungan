services:
  db:
    image: postgres:17-alpine
    container_name: smup-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard_smup
      POSTGRES_USER: smup
      POSTGRES_PASSWORD: smup
    ports:
      - "55432:5432"
    volumes:
      - smup-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smup -d dashboard_smup"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  smup-db-data:
